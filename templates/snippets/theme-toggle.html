  <button id="theme-toggle" aria-label="Toggle theme">
    <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>
</div>
<script>
  (function() {
    var stored = localStorage.getItem('theme');
    // Default to dark unless the user explicitly chose light.
    var isDark = stored !== 'light';
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    document.addEventListener('DOMContentLoaded', function() {
      var btn = document.getElementById('theme-toggle');
      btn.addEventListener('click', function() {
        var dark = document.documentElement.getAttribute('data-theme') === 'dark';
        var nowDark = !dark;
        document.documentElement.setAttribute('data-theme', nowDark ? 'dark' : 'light');
        localStorage.setItem('theme', nowDark ? 'dark' : 'light');
        // Keep syntax-highlighting CSS in sync with the manual toggle.
        var l = document.getElementById('giallo-light');
        var d = document.getElementById('giallo-dark');
        if (l) l.media = nowDark ? 'not all' : 'all';
        if (d) d.media = nowDark ? 'all' : 'not all';
      });

    });
  })();
</script>
